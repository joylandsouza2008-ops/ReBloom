services:
  - type: web
    name: rebloom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GRIEVANCE_EMAIL
        sync: false
      - key: GRIEVANCE_NAME
        value: Team Phoenix Queens
      - key: JOOBLE_API_KEY
        sync: false
      - key: JOOBLE_HOST
        value: jooble.org
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: AI_CALLS_PER_HOUR
        value: "40"
